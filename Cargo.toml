[package]
name = "dijo"
version = "1.7.0"
authors = ["Parham Alvani <parham.alvani@gmail.com>", "Akshay <nerdy@peppe.rs>"]
edition = "2024"
rust-version = "1.88"
description = "Scriptable, curses-based, digital habit tracker"
homepage = "https://github.com/1995parham/dijo"
repository = "https://github.com/1995parham/dijo"
readme = "./README.md"
keywords = ["tracker", "event-tracker", "tui", "journal"]
categories = ["date-and-time", "command-line-interface"]
license = "MIT"

[dependencies]
typetag = "0.2.23"
directories = "6.0.0"
toml = "1.2.1"
cursive = "0.21"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[dependencies.clap]
version = "4.6"
features = ["cargo"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
