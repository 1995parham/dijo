name: release

on:
  push:
    tags:
      - "v*.*.*"

# A tag is the whole release: the version comes from the tag, so nothing in the
# repository is bumped by hand first. After the release, the bump is committed
# back to main.
jobs:
  check:
    name: Check
    uses: ./.github/workflows/ci.yml

  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - name: Read the version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%B %d, %Y')" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [check, version]
    env:
      DIJO_VERSION: ${{ needs.version.outputs.version }}
      MAN_DATE: ${{ needs.version.outputs.date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: .tar.gz
            executable: dijo
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: .tar.gz
            executable: dijo
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: .tar.gz
            executable: dijo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: .zip
            executable: dijo.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Set the version on the man page
        shell: bash
        run: perl -pi -e 's/^\.TH .*/.TH DIJO 1 "$ENV{MAN_DATE}" dijo-$ENV{DIJO_VERSION}/' dijo.1

      - name: Create package directory
        run: |
          mkdir package
          cp LICENSE package/
          cp README.md package/
          cp "dijo.1" package/

      - name: Package for Linux/macOS
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} package/
          tar -czvf dijo-${{ matrix.target }}${{ matrix.archive_ext }} package/

      - name: Package for Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} package/
          Compress-Archive -Path package -DestinationPath dijo-${{ matrix.target }}${{ matrix.archive_ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dijo-${{ matrix.target }}
          path: dijo-${{ matrix.target }}${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_files

      - name: Display downloaded files
        run: find release_files -type f

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release_files/**/*.tar.gz
            release_files/**/*.zip

  bump:
    name: Commit the version to main
    runs-on: ubuntu-latest
    needs: [release, version]
    permissions:
      contents: write
    env:
      DIJO_VERSION: ${{ needs.version.outputs.version }}
      MAN_DATE: ${{ needs.version.outputs.date }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set the version
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{DIJO_VERSION}"/m' Cargo.toml
          perl -pi -e 's/^\.TH .*/.TH DIJO 1 "$ENV{MAN_DATE}" dijo-$ENV{DIJO_VERSION}/' dijo.1
          cargo update --workspace

      - name: Commit and push
        run: |
          git diff --quiet -- Cargo.toml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $DIJO_VERSION"
          git push origin HEAD:main

  packages:
    name: Packages
    needs: release
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
